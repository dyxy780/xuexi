name: CI - Tests

on:
  push:
    branches: [ main, learning/9-week-setup ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pytest-playwright pytest-cov
          playwright install --with-deps

      - name: Run unit & api tests
        run: |
          pytest -q --maxfail=1 --junitxml=reports/junit.xml --cov=./ --cov-report=xml

      - name: Upload test report (junit)
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
