name: CI - Tests

on:
  push:
    branches: [ main, learning/9-week-setup ]
  pull_request:
    branches: [ main ]

jobs:
  unit_api:
    name: Unit & API tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 软测/requirements.txt

      - name: Run unit & api tests
        run: |
          mkdir -p reports
          pytest 软测/tests -q --maxfail=1 --junitxml=reports/junit-unit-api.xml --cov=./ --cov-report=xml

      - name: Upload test report (junit)
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-api
          path: reports/junit-unit-api.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  ui:
    name: UI (Playwright) tests
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & Playwright browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r 软测/requirements.txt
          playwright install --with-deps

      - name: Run Playwright UI tests (headless)
        run: |
          mkdir -p reports
          pytest 软测/playwright/tests -q -m "ui" --junitxml=reports/junit-ui.xml || true

      - name: Upload UI junit
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui
          path: reports/junit-ui.xml
